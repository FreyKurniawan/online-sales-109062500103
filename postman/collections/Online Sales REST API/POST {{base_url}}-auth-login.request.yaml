$kind: http-request
name: Login
description: ""
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "customer@example.com",
      "password": "password123",
      "device_name": "Postman Praktikum"
    }
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      pm.collectionVariables.set('customer_token', json.access_token);"
    language: text/javascript
order: 3000
